<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: #17212b; 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 95vh;
        }
        #scanner-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #reader { 
            width: 100%; 
            max-width: 400px; 
            border-radius: 12px; 
            overflow: hidden; 
        }
        #success-container {
            display: none;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .code-text {
            font-family: monospace;
            font-size: 24px;
            color: #52cbff;
            margin: 15px 0 20px 0;
            word-break: break-all;
            background: #2b5278;
            padding: 12px;
            border-radius: 10px;
        }
        .btn {
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        .copy-btn { background-color: #27ae60; color: white; }
        .file-btn { background-color: #2980b9; color: white; }
        .retry-btn { background-color: #c0392b; color: white; }
        #file-input { display: none; }
    </style>
</head>
<body>
    <div id="scanner-container">
        <h3>Наведите камеру на штрих-код</h3>
        <div id="reader"></div>
        <button class="btn file-btn" onclick="document.getElementById('file-input').click()">📁 Загрузить фото</button>
        <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
    </div>
    
    <div id="success-container">
        <h3>✅ Штрих-код считан:</h3>
        <div class="code-text" id="result-view"></div>
        <button class="btn copy-btn" onclick="copyCode()">Копировать ✓</button>
        <button class="btn retry-btn" onclick="resetScanner()">Сканировать снова ❌</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let scannedVal = "";
        const scanner = new Html5Qrcode("reader");

        function startCamera() {
            scanner.start(
                { facingMode: "environment" },
                { fps: 20, qrbox: { width: 280, height: 130 } },
                (text) => {
                    scannedVal = text;
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    scanner.stop().then(() => showSuccess(text)).catch(() => showSuccess(text));
                }
            ).catch(() => {});
        }

        startCamera();

        function handleFile(e) {
            if (e.target.files && e.target.files.length > 0) {
                const file = e.target.files[0];
                
                // Останавливаем камеру перед обработкой файла
                scanner.stop().catch(() => {}).finally(() => {
                    // Сжимаем картинку через canvas, чтобы библиотека легко её прочитала
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        const img = new Image();
                        img.onload = function () {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 1000;
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * (scaleSize < 1 ? scaleSize : 1);
                            
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            
                            canvas.toBlob((blob) => {
                                const compressedFile = new File([blob], file.name, { type: 'image/jpeg' });
                                
                                scanner.scanFile(compressedFile, true)
                                    .then(text => {
                                        scannedVal = text;
                                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                                        showSuccess(text);
                                    })
                                    .catch(() => {
                                        alert("Штрих-код не найден на фото. Попробуйте сделать снимок ближе к наклейке.");
                                        resetScanner();
                                    });
                            }, 'image/jpeg', 0.9);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }
        }

        function showSuccess(text) {
            document.getElementById('scanner-container').style.display = 'none';
            document.getElementById('result-view').innerText = text;
            document.getElementById('success-container').style.display = 'block';
        }

        function resetScanner() {
            document.getElementById('success-container').style.display = 'none';
            document.getElementById('scanner-container').style.display = 'flex';
            document.getElementById('file-input').value = '';
            startCamera();
        }

        function copyCode() {
            if (tg.sendData) tg.sendData(scannedVal);
            navigator.clipboard.writeText(scannedVal).then(() => tg.close()).catch(() => tg.close());
        }
    </script>
</body>
</html>
