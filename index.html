<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер штрих-кодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: #17212b; 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 95vh;
        }
        #scanner-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #reader { 
            width: 100%; 
            max-width: 400px; 
            border-radius: 12px; 
            overflow: hidden; 
            background: #000;
        }
        #success-container {
            display: none;
            width: 100%;
            max-width: 400px;
            min-height: 85vh;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }
        .code-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
            overflow-y: auto;
            text-align: left;
            flex-grow: 1;
        }
        .code-item {
            font-family: monospace;
            font-size: 18px;
            color: #52cbff;
            background: #2b5278;
            padding: 14px;
            border-radius: 8px;
            word-break: break-all;
        }
        .buttons-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn {
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .copy-btn { background-color: #27ae60; color: white; }
        .file-btn { background-color: #2980b9; color: white; }
        .retry-btn { background-color: #c0392b; color: white; }
        #file-input { display: none; }
    </style>
</head>
<body>
    <div id="scanner-container">
        <h3>Наведите камеру на штрих-код</h3>
        <div id="reader"></div>
        <button class="btn file-btn" style="margin-top: 10px;" onclick="document.getElementById('file-input').click()">Загрузить фото 📁</button>
        <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
    </div>
    
    <div id="success-container">
        <div>
            <h3>✅ Найденные штрих-коды:</h3>
            <div class="code-list" id="result-list"></div>
        </div>
        <div class="buttons-group">
            <button class="btn copy-btn" onclick="copyAllCodes()">Скопировать ✅</button>
            <button class="btn retry-btn" onclick="resetScanner()">Сканировать снова ❌</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let foundCodes = [];
        const html5QrCode = new Html5Qrcode("reader");
        const zxingReader = new ZXing.BrowserMultiFormatReader();
        let isCameraRunning = false;

        function startCamera() {
            if (isCameraRunning) return;
            
            // Настройка конфигурации сканера под узкие горизонтальные штрих-коды
            const config = { 
                fps: 20, 
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return {
                        width: Math.floor(viewfinderWidth * 0.85),
                        height: Math.floor(viewfinderHeight * 0.25)
                    };
                },
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                }
            };

            // Запрос качественного разрешения камеры для чтения мелких линий
            const constraints = {
                facingMode: "environment",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            };

            html5QrCode.start(
                constraints,
                config,
                (text) => {
                    if (!foundCodes.includes(text)) {
                        foundCodes.push(text);
                    }
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    stopCameraAndShow();
                }
            ).then((cameraCapabilities) => {
                isCameraRunning = true;
                
                // Пробуем включить небольшой зум (1.5x), чтобы проще захватывать мелкие наклейки
                try {
                    if (cameraCapabilities && cameraCapabilities.zoom) {
                        const maxZoom = cameraCapabilities.zoom.max || 1;
                        const targetZoom = Math.min(1.5, maxZoom);
                        if (targetZoom > 1) {
                            html5QrCode.applyVideoConstraints({
                                advanced: [{ zoom: targetZoom }]
                            });
                        }
                    }
                } catch (e) {
                    console.log("Зум не поддерживается устройством");
                }
            }).catch((err) => {
                console.log("Ошибка камеры:", err);
            });
        }

        function stopCameraAndShow() {
            if (isCameraRunning) {
                html5QrCode.stop().then(() => {
                    isCameraRunning = false;
                    showSuccess();
                }).catch(() => {
                    isCameraRunning = false;
                    showSuccess();
                });
            } else {
                showSuccess();
            }
        }

        startCamera();

        async function handleFile(e) {
            if (e.target.files && e.target.files.length > 0) {
                const file = e.target.files[0];
                
                if (isCameraRunning) {
                    try { 
                        await html5QrCode.stop(); 
                        isCameraRunning = false;
                    } catch(e) {}
                }

                const reader = new FileReader();
                reader.onload = async function (event) {
                    const img = new Image();
                    img.onload = async function () {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1600;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * (scaleSize < 1 ? scaleSize : 1);
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const imageUrl = canvas.toDataURL('image/jpeg', 0.95);

                        try {
                            const results = await zxingReader.decodeFromImageUrl(imageUrl);
                            if (results) {
                                const items = Array.isArray(results) ? results : [results];
                                foundCodes = [];
                                items.forEach(item => {
                                    if (!foundCodes.includes(item.text)) {
                                        foundCodes.push(item.text);
                                    }
                                });

                                if (foundCodes.length > 0) {
                                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                                    showSuccess();
                                    return;
                                }
                            }
                            throw new Error();
                        } catch (err) {
                            alert("Штрих-коды не найдены на фото. Сделайте снимок ближе к наклейке.");
                            resetScanner();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function showSuccess() {
            document.getElementById('scanner-container').style.display = 'none';
            
            const listContainer = document.getElementById('result-list');
            listContainer.innerHTML = '';
            
            foundCodes.forEach((code) => {
                const div = document.createElement('div');
                div.className = 'code-item';
                div.textContent = code;
                listContainer.appendChild(div);
            });

            document.getElementById('success-container').style.display = 'flex';
        }

        function resetScanner() {
            foundCodes = [];
            document.getElementById('success-container').style.display = 'none';
            document.getElementById('scanner-container').style.display = 'flex';
            document.getElementById('file-input').value = '';
            startCamera();
        }

        function copyAllCodes() {
            const combinedText = foundCodes.join('\n');
            navigator.clipboard.writeText(combinedText).catch(() => {});
            if (tg.sendData) {
                tg.sendData(combinedText);
            }
            setTimeout(() => {
                tg.close();
            }, 100);
        }
    </script>
</body>
</html>
